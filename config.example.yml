http:
  # Address to listen on, for every API, health and metrics.
  addr: ':7070'

postgres:
  host: localhost
  port: 5432
  user: runcoil
  password: ''
  db: runcoil
  # libpq values: disable, prefer, require, verify-ca, verify-full.
  ssl_mode: prefer
  # Most connections in the pool.
  max_conns: 10

log:
  # debug, info, warn or error.
  level: info
  # text for a terminal, json for production.
  format: text
