me:
  get:
    operationId: getMe
    summary: Get the signed-in user
    description: >-
      Returns the signed-in user, the projects they can open with their role and
      permissions in each, and their server-wide permissions.
    tags:
      - Auth
    x-runcoil-permission: self
    responses:
      "200":
        description: The signed-in user
        content:
          application/json:
            schema:
              $ref: "../components/schemas/auth.yaml#/Me"
      "401":
        $ref: "../components/responses.yaml#/Unauthenticated"
        description: "unauthenticated: no live session"

mePassword:
  put:
    operationId: changeMyPassword
    summary: Change my password
    description: >-
      Sets a new password for the signed-in user and ends their other sessions. The new
      password has at least 8 characters, with an upper-case letter, a lower-case letter,
      a digit and a special character.
    tags:
      - Auth
    x-runcoil-permission: self
    requestBody:
      description: The current and the new password.
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/schemas/auth.yaml#/ChangePasswordRequest"
    responses:
      "204":
        description: The password is changed
      "400":
        $ref: "../components/responses.yaml#/InvalidRequest"
        description: "invalid_request: the body is not valid, the current password is wrong, or the new password is too weak"
      "401":
        $ref: "../components/responses.yaml#/Unauthenticated"
        description: "unauthenticated: no live session"
      "403":
        $ref: "../components/responses.yaml#/PermissionDenied"
        description: "permission_denied: the request comes from another origin"
      "413":
        $ref: "../components/responses.yaml#/PayloadTooLarge"
        description: "payload_too_large: the body is larger than 1 MiB"
