openapi: 3.1.0
info:
  title: Runcoil dashboard API
  version: 1.0.0
  description: The API of the Runcoil dashboard.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - url: /api/v1
security:
  - sessionCookie: []
tags:
  - name: Auth
    description: Signing in and out, and the signed-in user.
paths:
  /auth/login:
    $ref: "#/components/pathItems/login"
  /me:
    $ref: "#/components/pathItems/me"
  /me/password:
    $ref: "#/components/pathItems/mePassword"
  /auth/logout:
    $ref: "#/components/pathItems/logout"
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: runcoil_session
      description: The session cookie that login sets.
  schemas:
    LoginRequest:
      type: object
      description: A username or an email, and its password.
      required:
        - login
        - password
      additionalProperties: false
      properties:
        login:
          type: string
          description: A username or an email.
          minLength: 1
          example: admin
          x-order: 1
        password:
          type: string
          minLength: 1
          description: The user's password.
          example: Secret-123
          x-order: 2
    LoginResponse:
      type: object
      description: The signed-in user.
      required:
        - user
        - passwordChangeSuggested
      additionalProperties: false
      properties:
        user:
          $ref: "#/components/schemas/User"
          x-order: 1
          example:
            id: 019a5b1e-7c2d-7000-8000-4b1d2c3e4f50
            username: admin
            isServerAdmin: true
        passwordChangeSuggested:
          type: boolean
          description: True when the password is the first server admin's default, so the dashboard offers to change it.
          example: false
          x-order: 2
    User:
      type: object
      description: A dashboard user.
      required:
        - id
        - username
        - isServerAdmin
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          description: The user's ID.
          example: 019a5b1e-7c2d-7000-8000-4b1d2c3e4f50
          x-order: 1
        username:
          type: string
          description: The username, lowercase.
          example: admin
          x-order: 2
        email:
          type: string
          description: The email, lowercase. Absent when the user has none.
          example: admin@example.com
          x-order: 3
        isServerAdmin:
          type: boolean
          description: True for a server admin, who is admin in every project and manages users and projects.
          example: true
          x-order: 4
    Permission:
      type: string
      description: A permission, as resource:verb.
      example: runs:read
      enum:
        - runs:read
        - runs:cancel
        - tasks:read
        - schedules:read
        - schedules:write
        - workers:read
        - members:read
        - members:write
        - api_keys:read
        - api_keys:write
        - projects:create
        - users:read
        - users:write
    ProjectAccess:
      type: object
      description: A project the user can open.
      required:
        - id
        - name
        - role
        - permissions
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          description: The project's ID.
          example: 019a5b1e-7c2d-7000-8000-4b1d2c3e4f51
          x-order: 1
        name:
          type: string
          description: The project's name.
          example: default
          x-order: 2
        role:
          $ref: "#/components/schemas/Role"
          x-order: 3
        permissions:
          type: array
          description: The user's permissions in the project.
          x-order: 4
          example: ['runs:read', 'tasks:read', 'schedules:read', 'workers:read']
          items:
            $ref: "#/components/schemas/Permission"
    Role:
      type: string
      description: A role in a project. A server admin is admin in every project.
      example: admin
      enum:
        - admin
        - editor
        - viewer
    ErrorResponse:
      type: object
      description: The body of every error response.
      example:
        errors:
          - code: unauthenticated
            message: not signed in
      required:
        - errors
      additionalProperties: false
      properties:
        errors:
          type: array
          description: The errors of the request, at least one.
          example:
            - code: invalid_field
              message: current password is wrong
              field: currentPassword
          items:
            $ref: "#/components/schemas/Error"
    Error:
      type: object
      description: One error of a request.
      required:
        - code
        - message
      additionalProperties: false
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
          x-order: 1
        message:
          type: string
          description: For people. Clients never parse it.
          example: current password is wrong
          x-order: 2
        field:
          type: string
          description: The request field at fault, for missing_field and invalid_field.
          example: currentPassword
          x-order: 3
    ErrorCode:
      type: string
      description: The code of an error.
      example: invalid_field
      enum:
        - invalid_request
        - missing_field
        - invalid_field
        - unauthenticated
        - permission_denied
        - not_found
        - payload_too_large
        - internal
    Me:
      type: object
      description: The signed-in user and what they can open.
      required:
        - user
        - permissions
        - projects
      additionalProperties: false
      properties:
        user:
          $ref: "#/components/schemas/User"
          x-order: 1
          example:
            id: 019a5b1e-7c2d-7000-8000-4b1d2c3e4f50
            username: admin
            isServerAdmin: true
        permissions:
          type: array
          description: The server-wide permissions of the user.
          x-order: 2
          example: ['projects:create', 'users:read', 'users:write']
          items:
            $ref: "#/components/schemas/Permission"
        projects:
          type: array
          description: The projects the user can open, by name.
          x-order: 3
          example:
            - id: 019a5b1e-7c2d-7000-8000-4b1d2c3e4f51
              name: default
              role: viewer
              permissions: ['runs:read', 'tasks:read', 'schedules:read', 'workers:read']
          items:
            $ref: "#/components/schemas/ProjectAccess"
    ChangePasswordRequest:
      type: object
      description: The current password and the new one.
      required:
        - currentPassword
        - newPassword
      additionalProperties: false
      properties:
        currentPassword:
          type: string
          minLength: 1
          description: The password the user has now.
          example: admin
          x-order: 1
        newPassword:
          type: string
          minLength: 1
          description: The new password.
          example: Secret-123
          x-order: 2
  responses:
    InvalidRequest:
      description: "invalid_request, missing_field, invalid_field: the request is not valid"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthenticated:
      description: "unauthenticated: no live session, or a wrong login or password"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    PermissionDenied:
      description: "permission_denied: the caller lacks the operation's permission, or a write came from another origin"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    PayloadTooLarge:
      description: "payload_too_large: the request body is larger than 1 MiB"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Internal:
      description: "internal: an unexpected failure"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  pathItems:
    login:
      post:
        operationId: login
        summary: Sign in
        description: >-
          Checks a username or an email and its password, starts a session and sets its cookie. A disabled user cannot sign in.
        tags:
          - Auth
        security: []
        requestBody:
          description: The credentials.
          required: true
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginRequest"
        responses:
          "200":
            description: The session is started
            headers:
              Set-Cookie:
                description: The session cookie.
                required: true
                schema:
                  type: string
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/LoginResponse"
          "400":
            $ref: "#/components/responses/InvalidRequest"
          "401":
            $ref: "#/components/responses/Unauthenticated"
          "403":
            $ref: "#/components/responses/PermissionDenied"
          "413":
            $ref: "#/components/responses/PayloadTooLarge"
          "500":
            $ref: "#/components/responses/Internal"
    logout:
      post:
        operationId: logout
        summary: Sign out
        description: Ends the session and clears its cookie.
        tags:
          - Auth
        x-runcoil-permission: self
        responses:
          "204":
            description: The session is ended
            headers:
              Set-Cookie:
                description: Clears the session cookie.
                required: true
                schema:
                  type: string
          "401":
            $ref: "#/components/responses/Unauthenticated"
          "403":
            $ref: "#/components/responses/PermissionDenied"
          "500":
            $ref: "#/components/responses/Internal"
    me:
      get:
        operationId: getMe
        summary: Get the signed-in user
        description: >-
          Returns the signed-in user, the projects they can open with their role and permissions in each, and their server-wide permissions.
        tags:
          - Auth
        x-runcoil-permission: self
        responses:
          "200":
            description: The signed-in user
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/Me"
          "401":
            $ref: "#/components/responses/Unauthenticated"
          "500":
            $ref: "#/components/responses/Internal"
    mePassword:
      put:
        operationId: changeMyPassword
        summary: Change my password
        description: >-
          Sets a new password for the signed-in user and ends their other sessions. The new password has at least 8 characters, with an upper-case letter, a lower-case letter, a digit and a special character.
        tags:
          - Auth
        x-runcoil-permission: self
        requestBody:
          description: The current and the new password.
          required: true
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangePasswordRequest"
        responses:
          "204":
            description: The password is changed
          "400":
            $ref: "#/components/responses/InvalidRequest"
          "401":
            $ref: "#/components/responses/Unauthenticated"
          "403":
            $ref: "#/components/responses/PermissionDenied"
          "413":
            $ref: "#/components/responses/PayloadTooLarge"
          "500":
            $ref: "#/components/responses/Internal"
