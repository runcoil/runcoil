openapi: 3.1.0

info:
  title: Runcoil dashboard API
  version: 1.0.0
  description: The API of the Runcoil dashboard.
  license:
    name: Apache-2.0
    identifier: Apache-2.0

servers:
  - url: /api/v1

security:
  - sessionCookie: []

tags:
  - name: Auth
  - name: Projects
  - name: Users
  - name: Members

paths:
  /auth/login:
    $ref: "./paths/auth.yaml#/login"
  /auth/logout:
    $ref: "./paths/auth.yaml#/logout"
  /me:
    $ref: "./paths/me.yaml#/me"
  /me/password:
    $ref: "./paths/me.yaml#/mePassword"
  /projects:
    $ref: "./paths/projects.yaml#/projects"
  /projects/{projectId}/members:
    $ref: "./paths/members.yaml#/members"
  /projects/{projectId}/members/{userId}:
    $ref: "./paths/members.yaml#/member"
  /users:
    $ref: "./paths/users.yaml#/users"
  /users/{userId}:
    $ref: "./paths/users.yaml#/user"
  /users/{userId}/password:
    $ref: "./paths/users.yaml#/userPassword"

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: runcoil_session
      description: The session cookie that login sets.
