  content:
    application/json:
      schema:
        $ref: "./schemas/errors.yaml#/ErrorResponse"
Unauthenticated:
  description: "unauthenticated: no live session, or a wrong login or password"
  content:
    application/json:
      schema:
        $ref: "./schemas/errors.yaml#/ErrorResponse"
PermissionDenied:
  description: "permission_denied: the caller lacks the operation's permission"
