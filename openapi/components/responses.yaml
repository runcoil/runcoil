    application/json:
      schema:
        $ref: "./schemas/errors.yaml#/ErrorResponse"
Internal:
  description: "internal: an unexpected failure"
  content:
    application/json:
      schema:
        $ref: "./schemas/errors.yaml#/ErrorResponse"
