LoginRequest:
  type: object
  description: A username or an email, and its password.
  additionalProperties: false
  properties:
    login:
      type: string
      description: A username or an email.
      minLength: 1
      maxLength: 254
      example: admin
      x-order: 1
    password:
      type: string
      description: The user's password.
      minLength: 1
      maxLength: 128
      example: Secret-123
      x-order: 2
  required:
    - login
    - password

LoginResponse:
  type: object
  description: The signed-in user.
  additionalProperties: false
  properties:
    user:
      $ref: "#/User"
      x-order: 1
      example:
        id: 019a5b1e-7c2d-7000-8000-4b1d2c3e4f50
        username: admin
    passwordChangeSuggested:
      type: boolean
      description: True when the password is the first server admin's default, so the dashboard offers to change it.
      example: false
      x-order: 2
  required:
    - user
    - passwordChangeSuggested

ChangePasswordRequest:
  type: object
  description: The current password and the new one.
  additionalProperties: false
  properties:
    currentPassword:
      type: string
      description: The password the user has now.
      minLength: 1
      maxLength: 128
      example: admin
      x-order: 1
    newPassword:
      type: string
      description: The new password.
      minLength: 1
      maxLength: 128
      example: Secret-123
      x-order: 2
  required:
    - currentPassword
    - newPassword

User:
  type: object
  description: A dashboard user.
  additionalProperties: false
  properties:
    id:
      type: string
      format: uuid
      description: The user's ID.
      example: 019a5b1e-7c2d-7000-8000-4b1d2c3e4f50
      x-order: 1
    username:
      type: string
      description: The username, lowercase.
      example: admin
      x-order: 2
    email:
      type: string
      description: The email, lowercase. Absent when the user has none.
      example: admin@example.com
      x-order: 3
  required:
    - id
    - username

Me:
  type: object
  description: The signed-in user and what they can do.
  additionalProperties: false
  properties:
    user:
      $ref: "#/User"
      x-order: 1
      example:
        id: 019a5b1e-7c2d-7000-8000-4b1d2c3e4f50
        username: admin
    permissions:
      type: array
      description: The server-wide permissions of the user. Only a server admin has any.
      x-order: 2
      example:
        - projects:create
        - users:read
        - users:write
      items:
        $ref: "#/Permission"
    projects:
      type: array
      description: The projects the user can open, by name. A server admin is admin in every project.
      x-order: 3
      example:
        - id: 019a5b1e-7c2d-7000-8000-4b1d2c3e4f51
          name: default
          role: viewer
          permissions:
            - runs:read
            - tasks:read
            - schedules:read
            - workers:read
      items:
        $ref: "#/ProjectAccess"
  required:
    - user
    - permissions
    - projects

ProjectAccess:
  type: object
  description: A project the user can open.
  additionalProperties: false
  properties:
    id:
      type: string
      format: uuid
      description: The project's ID.
      example: 019a5b1e-7c2d-7000-8000-4b1d2c3e4f51
      x-order: 1
    name:
      type: string
      description: The project's name.
      example: default
      x-order: 2
    role:
      $ref: "#/Role"
      x-order: 3
    permissions:
      type: array
      description: The user's permissions in the project.
      x-order: 4
      example:
        - runs:read
        - tasks:read
        - schedules:read
        - workers:read
      items:
        $ref: "#/Permission"
  required:
    - id
    - name
    - role
    - permissions

Role:
  type: string
  description: A role in a project.
  example: admin
  enum:
    - admin
    - editor
    - viewer

Permission:
  type: string
  description: A permission, as resource:verb.
  example: runs:read
  enum:
    - runs:read
    - runs:cancel
    - tasks:read
    - schedules:read
    - schedules:write
    - workers:read
    - members:read
    - members:write
    - api_keys:read
    - api_keys:write
    - projects:create
    - users:read
    - users:write
