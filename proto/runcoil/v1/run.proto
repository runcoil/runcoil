syntax = "proto3";

package runcoil.v1;

message StepRecord {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    KIND_DO = 1;
  }

  string step_id = 1;
  Kind kind = 2;
  oneof result {
    bytes output = 3;
    Failure failure = 4;
  }
}

message Failure {
  enum Code {
    CODE_UNSPECIFIED = 0;
    CODE_ERROR = 1;
    CODE_PANIC = 2;
    CODE_STEP_FAILED = 3;
    CODE_ATTEMPT_LOST = 4;
    CODE_START_DEADLINE = 5;
    CODE_OUTPUT_NOT_ENCODABLE = 6;
    CODE_OUTPUT_TOO_LARGE = 7;
  }

  Code code = 1;
  string message = 2;
  string step_id = 3;
}
