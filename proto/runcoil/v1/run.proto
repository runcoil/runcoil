syntax = "proto3";

package runcoil.v1;

import "buf/validate/validate.proto";

message StepRecord {
  string step_id = 1;
  StepKind kind = 2;
  oneof result {
    bytes output = 3;
    Failure failure = 4;
  }
}

message Failure {
  FailureCode code = 1;
  string message = 2;
  string step_id = 3 [(buf.validate.field).string.max_bytes = 1024];
}

enum StepKind {
  STEP_KIND_UNSPECIFIED = 0;
  STEP_KIND_DO = 1;
}

enum FailureCode {
  FAILURE_CODE_UNSPECIFIED = 0;
  FAILURE_CODE_ERROR = 1;
  FAILURE_CODE_PANIC = 2;
  FAILURE_CODE_STEP_FAILED = 3;
  FAILURE_CODE_ATTEMPT_LOST = 4;
  FAILURE_CODE_START_DEADLINE = 5;
  FAILURE_CODE_OUTPUT_NOT_ENCODABLE = 6;
  FAILURE_CODE_OUTPUT_TOO_LARGE = 7;
  FAILURE_CODE_RUN_DATA_LIMIT = 8;
}
