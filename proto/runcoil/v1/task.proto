syntax = "proto3";

package runcoil.v1;

import "buf/validate/validate.proto";
import "google/protobuf/duration.proto";

message TaskDefinition {
  string name = 1 [(buf.validate.field).string = {
    min_len: 1
    max_bytes: 255
  }];
  RetryPolicy retry = 2;
  google.protobuf.Duration start_deadline = 3 [(buf.validate.field).duration.gt = {}];
}

message RetryPolicy {
  // The first attempt included.
  uint32 max_attempts = 1;
  // The last delay repeats.
  repeated google.protobuf.Duration delays = 2 [(buf.validate.field).repeated = {
    max_items: 32
    items: {
      duration: {
        gte: {}
      }
    }
  }];
}
