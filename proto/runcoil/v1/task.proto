syntax = "proto3";

package runcoil.v1;

import "buf/validate/validate.proto";
import "google/protobuf/duration.proto";

message TaskDefinition {
  string name = 1 [(buf.validate.field).string = {
    min_len: 1
    max_bytes: 255
  }];
  RetryPolicy retry = 2;
  // Only for the first start. Unset: no deadline.
  google.protobuf.Duration start_deadline = 3 [(buf.validate.field).duration.gt = {}];
}

message RetryPolicy {
  // The first attempt included. Zero: the server's default.
  uint32 max_attempts = 1 [(buf.validate.field).uint32.lte = 30];
  // The last delay repeats. Empty: the server's default.
  repeated google.protobuf.Duration delays = 2 [(buf.validate.field).repeated = {
    max_items: 32
    items: {
      duration: {
        gte: {}
      }
    }
  }];
}
