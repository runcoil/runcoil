auto_migrate: false

log:
  level: info
  format: text

postgres:
  host: localhost
  port: 5432
  user: postgres
  password: postgres
  db: postgres
  ssl_mode: disable
  max_conns: 10

api:
  port: 8080

dispatcher:
  port: 7070
  claim_interval: 1s
  heartbeat_interval: 10s
  worker_ttl: 30s

retry:
  max_attempts: 4
  delays: [5s, 10s, 30s, 1m, 3m, 10m, 30m, 1h]
  jitter: 0.2

scheduler:
  requeue_delayed_runs_interval: 1s
  start_deadline_check_interval: 1s
  dead_worker_check_interval: 5s

run:
  max_lost_attempts: 5
