auto_migrate: false

log:
  level: info
  format: text

postgres:
  host: localhost
  port: 5432
  user: postgres
  password: postgres
  db: postgres
  ssl_mode: disable
  max_conns: 10

http:
  port: 7070

engine:
  poll_interval: 1s

worker:
  heartbeat_interval: 10s
  ttl: 30s

bootstrap:
  api_key: ""
