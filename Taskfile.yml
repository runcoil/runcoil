version: '3'

env:
  GOWORK: 'off'

vars:
  GOOSE_DBSTRING: '{{.GOOSE_DBSTRING | default "postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable"}}'
  GOOSE: >-
    GOOSE_DRIVER=postgres
    GOOSE_DBSTRING='{{.GOOSE_DBSTRING}}'
    GOOSE_MIGRATION_DIR=internal/storage/postgres/migration
    go tool -modfile=tools/go.mod goose

includes:
  proto:
    taskfile: ./proto/Taskfile.yml
    dir: ./proto

tasks:
  setup:
    desc: Download the modules and build the Go tools
    cmds:
      - go mod download
      - cmd: go mod download
        dir: tools
      - cmd: go mod download
        dir: proto
      - go build -modfile=tools/go.mod tool

  build:
    desc: Build the server
    cmds:
      - go build ./...

  run:
    desc: Run the server
    cmds:
      - go run ./cmd/runcoil {{.CLI_ARGS}}

  sqlc-gen:
    desc: Generate the Go code of the SQL queries
    sources:
      - internal/storage/postgres/sqlc/sqlc.yml
      - internal/storage/postgres/sqlc/*.sql
      - internal/storage/postgres/migration/*.sql
    generates:
      - internal/storage/postgres/sqlc/*.go
    cmds:
      - go tool -modfile=tools/go.mod sqlc generate -f internal/storage/postgres/sqlc/sqlc.yml

  migrate-up:
    desc: Apply every pending migration
    cmds:
      - '{{.GOOSE}} up'

  migrate-down:
    desc: Roll back the last migration
    cmds:
      - '{{.GOOSE}} down'

  migrate-reset:
    desc: Roll back every migration
    cmds:
      - '{{.GOOSE}} reset'

  migrate-status:
    desc: Show which migrations are applied
    cmds:
      - '{{.GOOSE}} status'

  migrate-create:
    desc: 'Create a migration: task migrate-create -- <name>'
    cmds:
      - '{{.GOOSE}} create {{.CLI_ARGS}} sql'

  worker-call:
    desc: "Call the worker protocol of the local server: task worker-call METHOD=Register TOKEN=<key or token> DATA='{...}'"
    dir: proto
    vars:
      DATA: '{{.DATA | default "{}"}}'
    requires:
      vars: [METHOD, TOKEN]
    cmds:
      - >-
        go tool -modfile=../tools/go.mod buf curl --schema . --protocol connect --http2-prior-knowledge
        -H 'Authorization: Bearer {{.TOKEN}}' -d '{{.DATA}}'
        http://localhost:7070/runcoil.v1.WorkerService/{{.METHOD}}

  dev-run-create:
    desc: "Create a Run in the Compose database: task dev-run-create APP=shop TASK=charge INPUT='{}'"
    vars:
      APP: '{{.APP | default "shop"}}'
      TASK: '{{.TASK | default "charge"}}'
      INPUT: '{{.INPUT | default "{}"}}'
    cmds:
      - >-
        docker compose exec -T postgres
        psql -U postgres -At -v ON_ERROR_STOP=1
        -v app='{{.APP}}' -v task='{{.TASK}}' -v input='{{.INPUT}}'
        < scripts/dev-run-create.sql

  test:
    desc: Run the tests with the race detector
    cmds:
      - go test -race ./...

  lint:
    desc: Run golangci-lint
    cmds:
      - go tool -modfile=tools/go.mod golangci-lint run ./...

  tidy:
    desc: Fail when go.mod or go.sum is not tidy
    cmds:
      - go mod tidy -diff
      - cmd: go mod tidy -diff
        dir: tools

  vuln:
    desc: Scan for known vulnerabilities
    cmds:
      - go tool -modfile=tools/go.mod govulncheck ./...

  check:
    desc: Run lint, test, tidy and vuln
    cmds:
      - task: lint
      - task: test
      - task: tidy
      - task: vuln
