version: '3'

env:
  GOWORK: 'off'

vars:
  GOOSE_DBSTRING: '{{.GOOSE_DBSTRING | default "postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable"}}'
  # The server makes IDs in Go; the dev tasks build a UUIDv7 in SQL.
  UUID7: "encode(set_bit(set_bit(overlay(uuid_send(gen_random_uuid()) PLACING substring(int8send(floor(extract(epoch FROM clock_timestamp()) * 1000)::bigint) FROM 3) FROM 1 FOR 6), 52, 1), 53, 1), 'hex')::uuid"
  GOOSE: >-
    GOOSE_DRIVER=postgres
    GOOSE_DBSTRING='{{.GOOSE_DBSTRING}}'
    GOOSE_MIGRATION_DIR=internal/storage/postgres/migration
    go tool -modfile=tools/go.mod goose

includes:
  proto:
    taskfile: ./proto/Taskfile.yml
    dir: ./proto

tasks:
  setup:
    desc: Download the modules and build the Go tools
    cmds:
      - go mod download
      - cmd: go mod download
        dir: tools
      - cmd: go mod download
        dir: proto
      - go build -modfile=tools/go.mod tool

  build:
    desc: Build the server
    cmds:
      - go build ./...

  run:
    desc: Run the server
    cmds:
      - go run ./cmd/runcoil {{.CLI_ARGS}}

  sqlc-gen:
    desc: Generate the Go code of the SQL queries
    sources:
      - internal/storage/postgres/sqlc/sqlc.yml
      - internal/storage/postgres/sqlc/*.sql
      - internal/storage/postgres/migration/*.sql
    generates:
      - internal/storage/postgres/sqlc/*.go
    cmds:
      - go tool -modfile=tools/go.mod sqlc generate -f internal/storage/postgres/sqlc/sqlc.yml

  migrate-up:
    desc: Apply every pending migration
    cmds:
      - '{{.GOOSE}} up'

  migrate-down:
    desc: Roll back the last migration
    cmds:
      - '{{.GOOSE}} down'

  migrate-reset:
    desc: Roll back every migration
    cmds:
      - '{{.GOOSE}} reset'

  migrate-status:
    desc: Show which migrations are applied
    cmds:
      - '{{.GOOSE}} status'

  migrate-create:
    desc: 'Create a migration: task migrate-create -- <name>'
    cmds:
      - '{{.GOOSE}} create {{.CLI_ARGS}} sql'

  worker-call:
    desc: "Call the worker protocol of the local server: task worker-call METHOD=Register TOKEN=<key or token> DATA='{...}'"
    dir: proto
    vars:
      DATA: '{{.DATA | default "{}"}}'
    requires:
      vars: [METHOD, TOKEN]
    cmds:
      - >-
        go tool -modfile=../tools/go.mod buf curl --schema . --protocol connect --http2-prior-knowledge
        -H 'Authorization: Bearer {{.TOKEN}}' -d '{{.DATA}}'
        http://localhost:7070/runcoil.v1.WorkerService/{{.METHOD}}

  db-seed:
    desc: Add the project default and the API key rc_api_local_dev to the Compose database
    cmds:
      - |
        docker compose exec -T postgres psql -U postgres -v ON_ERROR_STOP=1 <<'SQL'
        WITH p AS (
            INSERT INTO projects (id, name) VALUES ({{.UUID7}}, 'default')
            ON CONFLICT (name) DO UPDATE SET name = EXCLUDED.name
            RETURNING id
        )
        INSERT INTO api_keys (id, project_id, name, key_hash)
        SELECT {{.UUID7}}, p.id, 'local', sha256('rc_api_local_dev')
        FROM p
        ON CONFLICT (key_hash) DO NOTHING;
        SQL

  dev-run-create:
    desc: "Create a Run in the Compose database: task dev-run-create APP=shop TASK_NAME=charge INPUT='{}'"
    vars:
      APP: '{{.APP | default "shop"}}'
      TASK_NAME: '{{.TASK_NAME | default "charge"}}'
      INPUT: '{{.INPUT | default "{}"}}'
    cmds:
      - |
        docker compose exec -T postgres psql -U postgres -At -v ON_ERROR_STOP=1 \
          -v app='{{.APP}}' -v task='{{.TASK_NAME}}' -v input='{{.INPUT}}' <<'SQL'
        WITH t AS (
            SELECT id, project_id, retry_policy, start_deadline
            FROM tasks
            WHERE app = :'app' AND name = :'task'
        ), r AS (
            INSERT INTO runs (id, created_at, project_id, task_id, status, input, config)
            SELECT {{.UUID7}}, now(), project_id, id, 'queued', convert_to(:'input', 'UTF8'),
                   jsonb_build_object('retry', retry_policy, 'start_deadline', start_deadline)
            FROM t
            RETURNING id, project_id, task_id
        )
        INSERT INTO run_queue (run_id, project_id, task_id, ready_at, start_deadline_at)
        SELECT r.id, r.project_id, r.task_id, now(), now() + t.start_deadline
        FROM r
        JOIN t ON t.id = r.task_id
        RETURNING run_id;
        SQL

  test:
    desc: Run the tests with the race detector
    cmds:
      - go test -race ./...

  lint:
    desc: Run golangci-lint
    cmds:
      - go tool -modfile=tools/go.mod golangci-lint run ./...

  tidy:
    desc: Fail when go.mod or go.sum is not tidy
    cmds:
      - go mod tidy -diff
      - cmd: go mod tidy -diff
        dir: tools

  vuln:
    desc: Scan for known vulnerabilities
    cmds:
      - go tool -modfile=tools/go.mod govulncheck ./...

  check:
    desc: Run lint, test, tidy and vuln
    cmds:
      - task: lint
      - task: test
      - task: tidy
      - task: vuln
