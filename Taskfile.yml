version: '3'

dotenv: ['.env']

env:
  GOWORK: 'off'

tasks:
  build:
    desc: Build the server
    cmds:
      - go build ./...

  run:
    desc: Run the server with the settings in .env
    cmds:
      - go run ./cmd/runcoil {{.CLI_ARGS}}

  up:
    desc: Start PostgreSQL and the server in Docker Compose
    preconditions: &compose-preconditions
      - sh: test -f .env
        msg: Copy .env.example to .env and set POSTGRES_PASSWORD
      - sh: test -n "$POSTGRES_PASSWORD"
        msg: Set POSTGRES_PASSWORD in .env; the postgres image needs a password
    cmds:
      - docker compose up --build --detach --wait

  db:
    desc: Start only PostgreSQL in Docker Compose, for task run
    preconditions: *compose-preconditions
    cmds:
      - docker compose up --detach --wait postgres

  down:
    desc: Stop Docker Compose
    cmds:
      - docker compose down

  test:
    desc: Run the tests with the race detector
    cmds:
      - go test -race ./...

  lint:
    desc: Run golangci-lint
    cmds:
      - go tool -modfile=tools/go.mod golangci-lint run ./...

  tidy:
    desc: Fail when go.mod or go.sum is not tidy
    cmds:
      - go mod tidy -diff
      - cmd: go mod tidy -diff
        dir: tools

  vuln:
    desc: Scan for known vulnerabilities
    cmds:
      - go tool -modfile=tools/go.mod govulncheck ./...

  check:
    desc: Run lint, test, tidy and vuln
    cmds:
      - task: lint
      - task: test
      - task: tidy
      - task: vuln
