version: '3'

env:
  GOWORK: 'off'

vars:
  BUILD_PKG: github.com/runcoil/runcoil/internal/build
  VERSION:
    sh: git describe --tags --match 'v[0-9]*' --always --dirty 2>/dev/null || echo dev
  COMMIT:
    sh: git rev-parse HEAD 2>/dev/null || true
  BUILD_DATE:
    sh: date -u +%Y-%m-%dT%H:%M:%SZ
  LDFLAGS: >-
    -X {{.BUILD_PKG}}.Version={{.VERSION}}
    -X {{.BUILD_PKG}}.Commit={{.COMMIT}}
    -X {{.BUILD_PKG}}.BuildDate={{.BUILD_DATE}}
  GOOSE_DBSTRING: '{{.GOOSE_DBSTRING | default "postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable"}}'
  GOOSE: >-
    GOOSE_DRIVER=postgres
    GOOSE_DBSTRING='{{.GOOSE_DBSTRING}}'
    GOOSE_MIGRATION_DIR=internal/storage/postgres/migration
    go tool -modfile=tools/go.mod goose

includes:
  proto:
    taskfile: ./proto/Taskfile.yml
    dir: ./proto
  sdk-go:
    taskfile: ./sdks/go/Taskfile.yml
    dir: ./sdks/go

tasks:
  setup:
    desc: Download the modules and build the Go tools
    cmds:
      - go mod download
      - go -C tools mod download
      - go -C proto mod download
      - go build -modfile=tools/go.mod tool

  build:
    desc: Build the server
    cmds:
      - go build -ldflags '{{.LDFLAGS}}' ./...

  run:
    desc: Run the server
    cmds:
      - go run -ldflags '{{.LDFLAGS}}' ./cmd/runcoil {{.CLI_ARGS}}

  sqlc-gen:
    desc: Generate the Go code of the SQL queries
    sources:
      - internal/storage/postgres/sqlc/sqlc.yml
      - internal/storage/postgres/sqlc/*.sql
      - internal/storage/postgres/migration/*.sql
    generates:
      - internal/storage/postgres/sqlc/*.go
    cmds:
      - go tool -modfile=tools/go.mod sqlc generate -f internal/storage/postgres/sqlc/sqlc.yml

  oapi-gen-server:
    desc: Lint and bundle the OpenAPI spec, and generate the dashboard API server
    sources:
      - openapi/**/*.yaml
      - internal/api/gen/oapi-codegen.yaml
    generates:
      - openapi/openapi.gen.yaml
      - internal/api/gen/api.gen.go
    cmds:
      - cd openapi && go tool -modfile=../tools/go.mod vacuum bundle --composed openapi.yaml openapi.gen.yaml
      - cd openapi && go tool -modfile=../tools/go.mod vacuum lint openapi.gen.yaml
      - cd internal/api/gen && go tool -modfile=../../../tools/go.mod oapi-codegen -config oapi-codegen.yaml ../../../openapi/openapi.gen.yaml

  ui:install:
    desc: Install the dashboard's packages
    dir: ui
    cmds:
      - pnpm install --frozen-lockfile

  oapi-gen-client:
    desc: Generate the dashboard's API types from the OpenAPI bundle
    dir: ui
    sources:
      - ../openapi/openapi.gen.yaml
    generates:
      - src/api/schema.d.ts
    cmds:
      - pnpm run gen

  ui:dev:
    desc: Run the dashboard with /api proxied to the server on :8080
    dir: ui
    cmds:
      - pnpm run dev

  ui:check:
    desc: Format, lint, type check and test the dashboard
    dir: ui
    cmds:
      - pnpm run check
      - pnpm run test

  ui:build:
    desc: Build the dashboard into ui/dist, which the server embeds
    dir: ui
    cmds:
      - pnpm run build

  migrate-up:
    desc: Apply every pending migration
    cmds:
      - '{{.GOOSE}} up'

  migrate-down:
    desc: Roll back the last migration
    cmds:
      - '{{.GOOSE}} down'

  migrate-reset:
    desc: Roll back every migration
    cmds:
      - '{{.GOOSE}} reset'

  migrate-status:
    desc: Show which migrations are applied
    cmds:
      - '{{.GOOSE}} status'

  migrate-create:
    desc: 'Create a migration: task migrate-create -- <name>'
    cmds:
      - '{{.GOOSE}} create {{.CLI_ARGS}} sql'

  test:
    desc: Run the tests with the race detector
    cmds:
      - go test -race ./...

  lint:
    desc: Run golangci-lint
    cmds:
      - go tool -modfile=tools/go.mod golangci-lint run ./...

  tidy:
    desc: Fail when go.mod or go.sum is not tidy
    cmds:
      - go mod tidy -diff
      - go -C tools mod tidy -diff

  vuln:
    desc: Scan for known vulnerabilities
    cmds:
      - go tool -modfile=tools/go.mod govulncheck ./...

  check:
    desc: Run lint, test, tidy and vuln
    cmds:
      - task: lint
      - task: test
      - task: tidy
      - task: vuln
