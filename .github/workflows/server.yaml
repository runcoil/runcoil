name: Server

on:
  pull_request:
    branches: [main]
    paths:
      - '**'
      - '!ui/**'
  push:
    branches: [main]
    paths:
      - '**'
      - '!ui/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go
    uses: ./.github/workflows/go.yaml
    with:
      dir: .

  docker:
    name: Docker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/app/runcoil.dockerfile
          push: false
