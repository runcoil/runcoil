name: Proto CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'proto/**'
      - 'tools/**'
      - '.github/workflows/proto-ci.yaml'
  push:
    branches: [main]
    paths:
      - 'proto/**'
      - 'tools/**'
      - '.github/workflows/proto-ci.yaml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOWORK: 'off'

jobs:
  buf:
    name: Buf
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: bufbuild/buf-action@v1
        with:
          version: 1.75.0
          input: proto
          lint: true
          format: true
          breaking: false
          push: false
          pr_comment: false

  generate:
    name: Generated Code
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: tools/go.mod
          check-latest: true
      - uses: go-task/setup-task@v2
      - run: task proto:gen --force
      - name: Fail when generated code is stale
        run: git diff --exit-code && test -z "$(git status --porcelain)"

  go:
    name: Go
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: proto/go.mod
          check-latest: true
      - uses: go-task/setup-task@v2
      - run: task proto:build
      - run: task proto:tidy
