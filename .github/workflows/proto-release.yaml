name: Proto Release

on:
  push:
    branches: [main]
    paths:
      - 'proto/**'

permissions:
  contents: write

# One run at a time: two runs that read the tags together would pick the same version.
concurrency:
  group: proto-release
  cancel-in-progress: false

jobs:
  bump-tag:
    name: Bump Tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: anothrNick/github-tag-action@4ed44965e0db8dab2b466a16da04aec3cc312fd8 # 1.75.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Go needs the tag of a module in a subdirectory to start with that directory.
          TAG_PREFIX: proto/v
          DEFAULT_BUMP: patch
