name: Go

on:
  workflow_call:
    inputs:
      dir:
        description: The Go module to check
        type: string
        required: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOWORK: 'off'
    defaults:
      run:
        working-directory: ${{ inputs.dir }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ inputs.dir }}/go.mod
          check-latest: true
      - uses: go-task/setup-task@v2
      - run: task lint

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOWORK: 'off'
    defaults:
      run:
        working-directory: ${{ inputs.dir }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ inputs.dir }}/go.mod
          check-latest: true
      - uses: go-task/setup-task@v2
      - run: task test

  tidy:
    name: Tidy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOWORK: 'off'
    defaults:
      run:
        working-directory: ${{ inputs.dir }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ inputs.dir }}/go.mod
          check-latest: true
      - uses: go-task/setup-task@v2
      - run: task tidy

  vuln:
    name: Vuln
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOWORK: 'off'
    defaults:
      run:
        working-directory: ${{ inputs.dir }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ inputs.dir }}/go.mod
          check-latest: true
      - uses: go-task/setup-task@v2
      - run: task vuln
