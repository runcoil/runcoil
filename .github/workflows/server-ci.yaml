name: Server CI

on:
  pull_request:
    branches: [main]
    paths:
      - '**'
      - '!ui/**'
      - '!docs/**'
  push:
    branches: [main]
    paths:
      - '**'
      - '!ui/**'
      - '!docs/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOWORK: 'off'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - uses: go-task/setup-task@v2
      - run: task lint

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - uses: go-task/setup-task@v2
      - run: task test

  vuln:
    name: Vulnerability Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - uses: go-task/setup-task@v2
      - run: task vuln

  generated:
    name: Code Gen Check (sqlc, OpenAPI)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: tools/go.mod
          check-latest: true
      - uses: go-task/setup-task@v2
      - run: task sqlc-gen --force
      - run: task api:gen --force
      - name: Fail when generated code is stale
        run: git diff --exit-code && test -z "$(git status --porcelain)"
