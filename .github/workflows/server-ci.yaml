name: Server CI

on:
  pull_request:
    branches: [main]
    paths:
      - '**'
      - '!ui/**'
      - '!docs/**'
  push:
    branches: [main]
    paths:
      - '**'
      - '!ui/**'
      - '!docs/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOWORK: 'off'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - uses: go-task/setup-task@v2
      - run: task lint

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - uses: go-task/setup-task@v2
      - run: task test

  vuln:
    name: Vulnerability Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - uses: go-task/setup-task@v2
      - run: task vuln

  changes:
    name: Changed Files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      generated: ${{ steps.filter.outputs.generated }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -z "$BASE_SHA" ]; then
            echo "generated=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          pattern='^(internal/storage/postgres/(sqlc|migration)/|openapi/|internal/api/gen/|tools/go\.(mod|sum)$|Taskfile\.yml$|\.github/workflows/server-ci\.yaml$)'
          if git diff --name-only "$BASE_SHA" HEAD | grep -qE "$pattern"; then
            echo "generated=true" >> "$GITHUB_OUTPUT"
          else
            echo "generated=false" >> "$GITHUB_OUTPUT"
          fi

  generated:
    name: Code Gen Check (sqlc)
    needs: changes
    if: needs.changes.outputs.generated == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: tools/go.mod
          check-latest: true
          cache-dependency-path: tools/go.sum
      - uses: go-task/setup-task@v2
      - run: task sqlc-gen --force
      - name: Fail when generated code is stale
        run: git diff --exit-code && test -z "$(git status --porcelain)"
