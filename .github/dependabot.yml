# Version updates run weekly, one entry per part so each pull request
# touches one part. Security updates ignore the schedule and the cooldown.

version: 2

updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Ho_Chi_Minh
    cooldown:
      default-days: 5
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: gomod
