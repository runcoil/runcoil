services:
  postgres:
    image: postgres:18
    env_file: .env
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready --host 127.0.0.1 --username "$${POSTGRES_USER}" --dbname "$${POSTGRES_DB}"']
      interval: 2s
      timeout: 5s
      retries: 30

  runcoil:
    build:
      context: .
      dockerfile: docker/app/runcoil.dockerfile
    env_file: .env
    environment:
      HTTP_ADDR: ':7070'
      POSTGRES_HOST: postgres
      POSTGRES_PORT: '5432'
    ports:
      - '127.0.0.1:7070:7070'
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--spider', 'http://127.0.0.1:7070/readyz']
      interval: 2s
      timeout: 5s
      retries: 15
    stop_grace_period: 20s
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
